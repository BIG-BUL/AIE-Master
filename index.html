<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIE Brief Trainer</title>
<style>
:root{
  --base:#152229;
  --panel:#1D3039;
  --line:#2D4652;
  --stock:#DFE4DE;
  --stock2:#CDD5CE;
  --ink:#0B1317;
  --amber:#E7A23C;
  --red:#BF4436;
  --muted:#93A8B1;
  --ok:#5E9E78;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--base);
  color:var(--stock);
  font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 96px}
h1{
  font-size:19px;font-weight:700;letter-spacing:-0.01em;margin:0 0 2px;
}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

/* mode bar */
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:4px;margin-bottom:14px}
.modes button{
  appearance:none;border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:13px;font-weight:600;padding:9px 2px;border-radius:4px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--base);color:var(--stock);box-shadow:inset 0 0 0 1px var(--line)}

.scope{display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.chip{
  appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);
  font:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}

/* progress */
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}
.bar span{display:block;height:100%;background:var(--amber);width:0%;transition:width .2s ease}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:-8px 0 12px}

/* card */
.card{
  background:var(--stock);color:var(--ink);border-radius:4px;
  padding:0 0 16px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.card .band{
  display:flex;align-items:baseline;gap:10px;
  background:var(--stock2);border-bottom:1px solid rgba(11,19,23,.18);
  padding:9px 16px}
.card .band .num{font-size:13px;font-weight:700;letter-spacing:.02em}
.card .band .chap{font-size:11.5px;color:#4A5A61;margin-left:auto}
.card h2{font-size:20px;line-height:1.25;margin:14px 16px 10px;font-weight:700;letter-spacing:-0.01em}
.card .prompt{font-size:17px;line-height:1.4;margin:16px 16px 12px;font-weight:600}
ul.items{list-style:none;margin:0;padding:0 16px}
ul.items li{
  position:relative;padding:3px 0 3px 16px;font-size:15px;line-height:1.4;
  border-bottom:1px solid rgba(11,19,23,.07)}
ul.items li:last-child{border-bottom:0}
ul.items li::before{content:"";position:absolute;left:2px;top:12px;width:5px;height:1.5px;background:#7A8A90}
ul.items li.d1{padding-left:34px;font-size:14.3px;color:#2A3940}
ul.items li.d1::before{left:20px}
ul.items li.d2{padding-left:52px;font-size:13.8px;color:#3A4A50}
ul.items li.d2::before{left:38px}
ul.items li.flag{border-left:3px solid var(--amber);padding-left:13px;background:rgba(231,162,60,.10);
  margin:6px 0;font-size:14px}
ul.items li.flag::before{display:none}
ul.items li.warn{border-left-color:var(--red);background:rgba(191,68,54,.10)}
ul.items li b{font-weight:700}

/* answers / buttons */
.actions{display:grid;gap:8px;margin-top:14px}
.actions.two{grid-template-columns:1fr 1fr}
button.act{
  appearance:none;font:inherit;font-weight:600;font-size:15px;
  min-height:50px;border-radius:6px;cursor:pointer;
  background:var(--panel);color:var(--stock);border:1px solid var(--line)}
button.act.primary{background:var(--amber);color:#1A1204;border-color:var(--amber)}
button.act.good{border-color:var(--ok);color:#A8D6BA}
button.act.bad{border-color:var(--red);color:#E8A79E}
button.act:active{transform:translateY(1px)}
.choices{display:grid;gap:8px;margin-top:14px}
button.choice{
  appearance:none;font:inherit;font-size:15px;text-align:left;line-height:1.35;
  padding:13px 14px;min-height:50px;border-radius:6px;cursor:pointer;
  background:var(--panel);color:var(--stock);border:1px solid var(--line)}
button.choice.right{border-color:var(--ok);background:rgba(94,158,120,.18)}
button.choice.wrong{border-color:var(--red);background:rgba(191,68,54,.18)}
button.choice:disabled{cursor:default;opacity:.85}
.why{margin-top:12px;padding:12px 13px;border-left:3px solid var(--amber);
  background:var(--panel);border-radius:0 6px 6px 0;font-size:14.5px;color:#D7DFD9}

/* index + score */
.index{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 0}
.index .row{display:flex;gap:11px;align-items:baseline;padding:8px 14px;border-bottom:1px solid rgba(45,70,82,.6);font-size:14.5px}
.index .row:last-child{border-bottom:0}
.index .row .n{font-size:12.5px;color:var(--amber);min-width:44px}
.index .row .c{color:var(--muted);font-size:12.5px;margin-left:auto}
.score{font-size:40px;font-weight:700;letter-spacing:-0.02em;margin:4px 0 2px}
.note{color:var(--muted);font-size:13.5px;margin:10px 0 0}
a{color:var(--amber)}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- WRITTEN QUIZ ITEMS ---------- */

/* ---------- STATE ---------- */
const S = {mode:"spine", scope:"24", q:null, i:0, hits:0, miss:[], queue:[], done:0, showIndex:false, answered:false};
const app = document.getElementById("app");
const modesEl = document.getElementById("modes");
const scopeEl = document.getElementById("scope");

const MODES = [["spine","Spine"],["cards","Cards"],["quiz","Quiz"],["brief","Brief it"]];
const SCOPES = [["24","Ch 24"],["25","Ch 25"],["both","Both"]];

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function chap(id){return DATA.find(d=>d.id===id);}
function paras(){
  if(S.scope==="both") return DATA.flatMap(d=>d.paras.map(p=>({...p,cid:d.id})));
  return chap(S.scope).paras.map(p=>({...p,cid:S.scope}));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pct(n,d){return d?Math.round(100*n/d):0;}

/* ---------- SHARED RENDER ---------- */
function itemsHtml(items){
  return "<ul class='items'>"+items.map(raw=>{
    let s=raw, cls="";
    if(s[0]==="~"){return "<li class='flag'>"+esc(s.slice(1))+"</li>";}
    if(s[0]==="!"){return "<li class='flag warn'>"+esc(s.slice(1))+"</li>";}
    if(s.slice(0,2)===">>"){cls="d2";s=s.slice(2);}
    else if(s[0]===">"){cls="d1";s=s.slice(1);}
    return "<li class='"+cls+"'>"+esc(s)+"</li>";
  }).join("")+"</ul>";
}
function cardHtml(p,body){
  const c = p.cid==="24" ? "Team Brief" : "Aircrew Brief";
  return "<div class='card'><div class='band'><span class='num mono'>"+esc(p.n)+"</span>"+
    "<span class='chap'>"+c+"</span></div>"+body+"</div>";
}
function bar(n,d){return "<div class='bar'><span style='width:"+pct(n,d)+"%'></span></div>";}
function metaLine(l,r){return "<div class='meta'><span>"+esc(l)+"</span><span>"+esc(r)+"</span></div>";}

function drawChrome(){
  modesEl.innerHTML = MODES.map(([k,l])=>
    "<button data-m='"+k+"' aria-pressed='"+(S.mode===k)+"'>"+l+"</button>").join("");
  scopeEl.innerHTML = SCOPES.map(([k,l])=>
    "<button class='chip' data-s='"+k+"' aria-pressed='"+(S.scope===k)+"'>"+l+"</button>").join("")
    + "<button class='chip' data-reset='1'>Restart</button>";
}
modesEl.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.mode=b.dataset.m;reset();});
scopeEl.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.reset){reset();return;} S.scope=b.dataset.s;reset();});

function reset(){
  S.i=0;S.hits=0;S.miss=[];S.done=0;S.answered=false;S.showIndex=false;S.q=null;
  const ps=paras();
  if(S.mode==="cards") S.queue=shuffle(ps);
  else if(S.mode==="brief") S.queue=ps.slice();
  else if(S.mode==="quiz") S.queue=shuffle(buildQuiz());
  else S.queue=shuffle(buildSpine());
  render();
}

/* ---------- SPINE DRILL ---------- */
function buildSpine(){
  const out=[];
  DATA.forEach(d=>{
    if(S.scope!=="both" && d.id!==S.scope) return;
    const ps=d.paras;
    ps.forEach((p,idx)=>{
      const others=shuffle(ps.filter(x=>x.n!==p.n)).slice(0,3);
      out.push({q:"In the "+(d.id==="24"?"Team":"Aircrew")+" Brief, what is paragraph "+p.n+"?",
        o:shuffle([p.t,...others.map(x=>x.t)]),a:p.t,
        w:p.n+" — "+p.t+". Position "+(idx+1)+" of "+ps.length+"."});
      out.push({q:"Which paragraph covers " + p.t + "?",
        o:shuffle([p.n,...others.map(x=>x.n)]),a:p.n,
        w:p.n+" — "+p.t+"."});
      if(idx<ps.length-1){
        const nx=ps[idx+1];
        const wrong=shuffle(ps.filter(x=>x.n!==nx.n&&x.n!==p.n)).slice(0,3);
        out.push({q:"What comes immediately after "+p.n+" "+p.t+"?",
          o:shuffle([nx.t,...wrong.map(x=>x.t)]),a:nx.t,
          w:"After "+p.n+" comes "+nx.n+" "+nx.t+"."});
      }
    });
  });
  return out;
}

/* ---------- QUIZ ---------- */
function buildQuiz(){
  const pool = S.scope==="both" ? QUIZ : QUIZ.filter(x=>x.c===S.scope);
  return pool.map(x=>({q:x.q,o:shuffle(x.o),a:x.o[x.a],w:x.w}));
}

/* ---------- RENDER ---------- */
function render(){
  drawChrome();
  if(S.mode==="cards") return renderCards();
  if(S.mode==="brief") return renderBrief();
  return renderMC();
}

function renderMC(){
  const total=S.queue.length;
  if(S.i>=total) return renderScore(S.hits,total,S.mode==="spine"?"Spine drill":"Quiz");
  const item=S.queue[S.i];
  let extra="";
  if(S.mode==="spine"){
    extra = "<div class='actions'><button class='act' data-idx='1'>"+(S.showIndex?"Hide the index":"Show the index")+"</button></div>";
  }
  app.innerHTML = bar(S.i,total)+metaLine((S.i+1)+" of "+total, S.hits+" correct")+
    "<div class='card'><p class='prompt'>"+esc(item.q)+"</p></div>"+
    "<div class='choices'>"+item.o.map(o=>"<button class='choice' data-o=\""+esc(o).replace(/"/g,"&quot;")+"\">"+esc(o)+"</button>").join("")+"</div>"+
    "<div id='after'></div>"+extra+
    (S.showIndex?indexHtml():"");
  app.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>answer(b,item)));
  const ix=app.querySelector("[data-idx]");
  if(ix) ix.addEventListener("click",()=>{S.showIndex=!S.showIndex;render();});
}

function answer(btn,item){
  if(S.answered) return;
  S.answered=true;
  const picked=btn.dataset.o;
  const right = picked===item.a;
  app.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;
    if(b.dataset.o===item.a) b.classList.add("right");
  });
  if(right) S.hits++; else btn.classList.add("wrong");
  const after=document.getElementById("after");
  after.innerHTML = "<div class='why'>"+esc(item.w)+"</div>"+
    "<div class='actions'><button class='act primary' id='next'>Next</button></div>";
  document.getElementById("next").addEventListener("click",()=>{S.i++;S.answered=false;render();});
  document.getElementById("next").focus();
}

function renderCards(){
  const total=S.queue.length+S.done;
  if(!S.queue.length) return renderScore(S.done,total,"Cards");
  const p=S.queue[0];
  app.innerHTML = bar(S.done,total)+metaLine(S.queue.length+" left", S.done+" cleared")+
    cardHtml(p,"<h2>"+esc(p.t)+"</h2><p style='margin:0 16px;color:#4A5A61;font-size:14px'>"+
      p.items.filter(x=>x[0]!=="~"&&x[0]!=="!").length+" items to call</p>")+
    "<div class='actions'><button class='act primary' id='flip'>Show the contents</button></div>";
  document.getElementById("flip").addEventListener("click",()=>{
    app.innerHTML = bar(S.done,total)+metaLine(S.queue.length+" left", S.done+" cleared")+
      cardHtml(p,"<h2>"+esc(p.t)+"</h2>"+itemsHtml(p.items))+
      "<div class='actions two'><button class='act bad' id='again'>Again</button>"+
      "<button class='act good' id='got'>Got it</button></div>";
    document.getElementById("again").addEventListener("click",()=>{
      const c=S.queue.shift();S.queue.push(c);render();});
    document.getElementById("got").addEventListener("click",()=>{
      S.queue.shift();S.done++;render();});
  });
}

function renderBrief(){
  const total=S.queue.length;
  if(S.i>=total) return renderBriefScore();
  const p=S.queue[S.i];
  app.innerHTML = bar(S.i,total)+metaLine("Paragraph "+(S.i+1)+" of "+total, S.hits+" clean")+
    cardHtml(p,"<h2>"+esc(p.t)+"</h2><p style='margin:0 16px;color:#4A5A61;font-size:14px'>"+
      "Brief this paragraph out loud, then check yourself.</p>")+
    "<div class='actions'><button class='act primary' id='reveal'>Check the items</button></div>";
  document.getElementById("reveal").addEventListener("click",()=>{
    app.innerHTML = bar(S.i,total)+metaLine("Paragraph "+(S.i+1)+" of "+total, S.hits+" clean")+
      cardHtml(p,"<h2>"+esc(p.t)+"</h2>"+itemsHtml(p.items))+
      "<div class='actions two'><button class='act bad' id='m'>Missed items</button>"+
      "<button class='act good' id='h'>Called it all</button></div>";
    document.getElementById("h").addEventListener("click",()=>{S.hits++;S.i++;render();});
    document.getElementById("m").addEventListener("click",()=>{S.miss.push(p);S.i++;render();});
  });
}

function renderBriefScore(){
  const total=S.hits+S.miss.length;
  app.innerHTML = "<div class='card'><div class='band'><span class='num mono'>RUN COMPLETE</span></div>"+
    "<h2 style='margin-bottom:4px'>"+S.hits+" of "+total+" paragraphs clean</h2>"+
    (S.miss.length?"<p style='margin:0 16px 8px;color:#4A5A61;font-size:14px'>Weak paragraphs:</p>"+
      itemsHtml(S.miss.map(p=>p.n+"  "+p.t)) :
      "<p style='margin:0 16px;color:#4A5A61;font-size:14px'>Full brief called cold. Run it again scoped to the other chapter.</p>")+
    "</div>"+
    "<div class='actions'>"+
    (S.miss.length?"<button class='act primary' id='redo'>Run the weak paragraphs</button>":"")+
    "<button class='act' id='again2'>Start the run over</button></div>";
  const r=document.getElementById("redo");
  if(r) r.addEventListener("click",()=>{S.queue=S.miss.slice();S.i=0;S.hits=0;S.miss=[];render();});
  document.getElementById("again2").addEventListener("click",reset);
}

function renderScore(hit,total,label){
  app.innerHTML = "<div class='card'><div class='band'><span class='num mono'>"+esc(label.toUpperCase())+"</span></div>"+
    "<div style='padding:10px 16px 4px'><div class='score'>"+pct(hit,total)+"%</div>"+
    "<div style='color:#4A5A61;font-size:14px'>"+hit+" of "+total+"</div></div></div>"+
    "<div class='actions'><button class='act primary' id='again3'>Run it again</button></div>";
  document.getElementById("again3").addEventListener("click",reset);
}

function indexHtml(){
  return DATA.filter(d=>S.scope==="both"||d.id===S.scope).map(d=>
    "<p class='note'>"+esc(d.title)+"</p><div class='index'>"+
    d.paras.map(p=>"<div class='row'><span class='n mono'>"+esc(p.n)+"</span><span>"+esc(p.t)+"</span>"+
      "<span class='c'>"+p.items.filter(x=>x[0]!=="~"&&x[0]!=="!").length+"</span></div>").join("")+
    "</div>").join("");
}

reset();
</script>
